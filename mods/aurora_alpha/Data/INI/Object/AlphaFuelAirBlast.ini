; Hold the shootdown coordinates for one logic frame. Nearby Alphas can then
; chain-react through normal updates without nesting their death callbacks.
Object SupW_AlphaDeathBlast
  EditorSorting = SYSTEM
  KindOf = IMMOBILE INERT NO_COLLIDE
  Body = InactiveBody ModuleTag_Body
  End
  Behavior = LifetimeUpdate ModuleTag_Fuse
    MinLifetime = 1
    MaxLifetime = 1
  End
  Behavior = FireWeaponWhenDeadBehavior ModuleTag_Blast
    StartsActive = Yes
    DeathWeapon = SupW_FuelBombDetonationWeapon
  End
  Behavior = FXListDie ModuleTag_SoundAndShake
    DeathFX = FX_DaisyCutterFinalExplosion
  End
  Behavior = DestroyDie ModuleTag_Cleanup
  End
End
