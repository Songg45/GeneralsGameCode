Object SupW_SupplyGunship
  DisplayName = OBJECT:SpectreGunship
  Side = AmericaSuperWeaponGeneral
  EditorSorting = VEHICLE
  RadarPriority = UNIT
  KindOf = PRELOAD VEHICLE AIRCRAFT TRANSPORT CAN_ATTACK FORCEATTACKABLE IGNORED_IN_GUI EMP_HARDENED
  VisionRange = 360
  ShroudClearingRange = 360

  Draw = W3DModelDraw ModuleTag_Fuselage
    DefaultConditionState
      Model = AVSGunship
      WeaponLaunchBone = PRIMARY Muzzle
      WeaponMuzzleFlash = PRIMARY MuzzleFX
    End
    ConditionState = DOOR_1_OPENING
      Animation = AVSGunship.AVSGunship
      AnimationMode = ONCE
      Flags = MAINTAIN_FRAME_ACROSS_STATES
    End
    ConditionState = DOOR_1_CLOSING
      Animation = AVSGunship.AVSGunship
      AnimationMode = ONCE_BACKWARDS
      Flags = MAINTAIN_FRAME_ACROSS_STATES
    End
    ConditionState = REALLYDAMAGED
      Model = AVSGunship_D
    End
  End
  Draw = W3DModelDraw ModuleTag_Cannon
    DefaultConditionState
      Model = AVSGUNSHIP_GUN
      TurretPitch = TURRETEL01
      WeaponFireFXBone = PRIMARY Muzzle
      WeaponMuzzleFlash = PRIMARY MuzzleFX
    End
  End
  SoundAmbient = SpectreGunshipAmbientLoop
  SoundAmbientRubble = NoSound

  Body = ActiveBody ModuleTag_Body
    MaxHealth = 600
    InitialHealth = 600
  End
  ArmorSet
    Conditions = None
    Armor = SpectreGunshipArmor
    DamageFX = TankDamageFX
  End
  WeaponSet
    Conditions = None
    Weapon = PRIMARY SupW_SupplyGunshipCannon
  End
  Behavior = DeliverPayloadAIUpdate ModuleTag_Flight
    DoorDelay = 500
    AutoAcquireEnemiesWhenIdle = YES ATTACK_BUILDINGS
    MoodAttackCheckRate = 200
    Turret
      ControlledWeaponSlots = PRIMARY
      TurretTurnRate = 360
      TurretPitchRate = 180
      AllowsPitch = Yes
      MinPhysicalPitch = -90
    End
  End
  Locomotor = SET_NORMAL B52Locomotor
  Behavior = TransportContain ModuleTag_Cargo
    Slots = 1
    AllowInsideKindOf = CRATE
    ScatterNearbyOnExit = No
    OrientLikeContainerOnExit = Yes
    KeepContainerVelocityOnExit = Yes
    NumberOfExitPaths = 0
    DestroyRidersWhoAreNotFreeToExit = Yes
  End
  Behavior = PhysicsBehavior ModuleTag_Physics
    Mass = 500
  End
  Behavior = JetSlowDeathBehavior ModuleTag_Death
    DestructionDelay = 2000
    FXInitialDeath = FX_SpectreGunshipExplosionLight
    FXHitGround = FX_SpectreGunshipDeathExplosion
    OCLFinalBlowUp = OCL_SpectreDeathFinalBlowUp
  End
  Geometry = BOX
  GeometryMajorRadius = 40
  GeometryMinorRadius = 10
  GeometryHeight = 10
  GeometryIsSmall = No
  Shadow = SHADOW_VOLUME
End
